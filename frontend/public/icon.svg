<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kancha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ecf8e" />
      <stop offset="100%" stop-color="#2ba870" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a22" />
      <stop offset="100%" stop-color="#0b0f14" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#243040" stroke-width="8" />
  
  <!-- Outer Field / Cancha Outline -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="url(#kancha-grad)" stroke-width="16" />
  
  <!-- Center Line -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="url(#kancha-grad)" stroke-width="14" />
  
  <!-- Center Circle -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="url(#kancha-grad)" stroke-width="14" />
  <circle cx="256" cy="256" r="12" fill="#3ecf8e" />
  
  <!-- Top Goal Box -->
  <path d="M 176 96 L 176 160 L 336 160 L 336 96" fill="none" stroke="url(#kancha-grad)" stroke-width="14" stroke-linejoin="round" />
  
  <!-- Bottom Goal Box -->
  <path d="M 176 416 L 176 352 L 336 352 L 336 416" fill="none" stroke="url(#kancha-grad)" stroke-width="14" stroke-linejoin="round" />
</svg>
